name: Test InkFlow

# La pubblicazione avviene su Cloudflare Pages (collegato alla repo privata),
# che a ogni push esegue scripts/build.sh. Qui girano i test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: TZ=Europe/Rome npm test
      - name: Prova della build
        run: bash scripts/build.sh
